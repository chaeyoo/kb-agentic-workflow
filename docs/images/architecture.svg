<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'WenQuanYi Zen Hei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e9e5b"/>
    </marker>
    <marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d9731a"/>
    </marker>
    <style>
      .t { font-size: 18px; font-weight: 700; fill: #1b1f24; }
      .s { font-size: 14.5px; fill: #444; }
      .xs { font-size: 12.5px; fill: #666; }
      .mono { font-family: 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 13px; fill: #333; }
      .hdr { font-size: 19px; font-weight: 800; }
      .badge { font-size: 15px; font-weight: 800; fill: #fff; }
      .edge { font-size: 13px; fill: #333; font-weight: 600; }
    </style>
  </defs>

  <rect width="1600" height="1040" fill="#ffffff"/>

  <!-- 제목 -->
  <text x="40" y="52" font-size="28" font-weight="800" fill="#1b1f24">도메인 정책 에이전트 워크플로우 전체 구조</text>
  <text x="40" y="80" class="s">에이전트와 개발자 AI 도구가 같은 MCP 서버에서 정책을 조회합니다. 접근 권한만 다르고, 정책 반영은 사람이 승인해야 합니다.</text>

  <!-- ============ 사용자 ============ -->
  <text x="40" y="140" class="hdr" fill="#555">사용자</text>

  <rect x="40" y="170" width="250" height="130" rx="12" fill="#f4f5f7" stroke="#9aa1ab" stroke-width="1.5"/>
  <text x="58" y="200" class="t">개발자</text>
  <text x="58" y="226" class="s">외주 · 클라이언트팀</text>
  <text x="58" y="250" class="s">Claude Code / Cursor 로 코딩 중</text>
  <text x="58" y="282" class="xs">정책 조회만 가능</text>

  <rect x="40" y="400" width="250" height="110" rx="12" fill="#f4f5f7" stroke="#9aa1ab" stroke-width="1.5"/>
  <text x="58" y="430" class="t">질문하는 사람</text>
  <text x="58" y="456" class="s">기획 · CS · 개발 누구나</text>
  <text x="58" y="480" class="s">웹에서 정책 질문</text>

  <rect x="40" y="620" width="250" height="140" rx="12" fill="#f4f5f7" stroke="#9aa1ab" stroke-width="1.5"/>
  <text x="58" y="650" class="t">정책 담당자</text>
  <text x="58" y="676" class="s">기획 · 문서 담당</text>
  <text x="58" y="702" class="s">보드에서 결정 코멘트</text>
  <text x="58" y="726" class="s">변경안 승인 / 수정요청</text>
  <text x="58" y="750" class="xs">정책 반영은 담당자 승인으로만</text>

  <!-- ============ service 서버 ============ -->
  <rect x="360" y="150" width="660" height="680" rx="16" fill="#f3f7ff" stroke="#3b6fd8" stroke-width="2"/>
  <text x="380" y="140" class="hdr" fill="#2b58b8">service 서버 · :8787</text>

  <rect x="390" y="180" width="600" height="90" rx="10" fill="#fff" stroke="#8fb0ef"/>
  <text x="410" y="208" class="t">웹 UI</text>
  <text x="410" y="234" class="s">Q&amp;A · 보드(칸반) · 정책서 뷰어(버전 · diff)</text>
  <text x="410" y="256" class="xs">에이전트가 무엇을 하는지 실시간으로 보여 줌</text>

  <rect x="390" y="300" width="600" height="90" rx="10" fill="#fff" stroke="#8fb0ef"/>
  <text x="410" y="328" class="t">REST API</text>
  <text x="410" y="354" class="s">정책서 · 보드 · 변경안 · 실행 기록</text>
  <text x="410" y="376" class="s">변경안 승인은 <tspan font-weight="700">사람만</tspan> → 섹션 새 버전 생성 (v2 → v3)</text>

  <rect x="390" y="420" width="600" height="150" rx="10" fill="#e3ecff" stroke="#3b6fd8" stroke-width="1.5"/>
  <text x="410" y="450" class="t">에이전트</text>
  <text x="410" y="478" class="s">모델 호출 → MCP 도구 실행 → 결과를 모델에 전달 → 끝날 때까지 반복</text>
  <text x="410" y="504" class="s">근거가 없거나 모순이면 티켓 생성 · 담당자 결정이 있으면 변경안 작성</text>
  <text x="410" y="530" class="s">승인이 필요한 동작은 사람이 처리할 때까지 대기</text>
  <text x="410" y="556" class="xs">live: Claude API 호출 · replay: 녹화 재생 (발표 당일 장애 대비)</text>

  <rect x="390" y="600" width="600" height="200" rx="10" fill="#fffbea" stroke="#d6b64a" stroke-width="1.5"/>
  <text x="410" y="630" class="t">저장소 (파일)</text>
  <text x="410" y="660" class="s">• 정책서 5개 · 섹션별 버전 이력</text>
  <text x="410" y="686" class="s">• 티켓 · 코멘트 (보드)</text>
  <text x="410" y="712" class="s">• 변경안 (diff · 승인 상태)</text>
  <text x="410" y="738" class="s">• 에이전트 실행 기록 · Q&amp;A 기록</text>
  <text x="410" y="774" class="xs">DB 없음 · 모두 가상 데이터 · service 서버만 파일에 접근</text>

  <!-- ============ MCP 서버 ============ -->
  <rect x="1100" y="150" width="460" height="560" rx="16" fill="#effaf3" stroke="#2e9e5b" stroke-width="2"/>
  <text x="1120" y="140" class="hdr" fill="#23804a">MCP 서버 · :8788</text>

  <rect x="1130" y="180" width="400" height="80" rx="10" fill="#fff" stroke="#86cfa3"/>
  <text x="1150" y="208" class="t">접근 인증</text>
  <text x="1150" y="232" class="s">접근 키(Bearer)의 권한에 맞는 도구만 노출</text>
  <text x="1150" y="252" class="xs">키 없음 / 틀림 → 401 거부</text>

  <rect x="1130" y="280" width="400" height="170" rx="10" fill="#fff" stroke="#86cfa3"/>
  <text x="1150" y="308" class="t">조회 도구 <tspan class="xs" font-weight="400">read 권한 · 개발자 + 에이전트</tspan></text>
  <text x="1150" y="336" class="mono">search_policies</text>
  <text x="1150" y="358" class="mono">get_policy_document</text>
  <text x="1150" y="380" class="mono">get_policy_history</text>
  <text x="1150" y="402" class="mono">list_open_questions</text>
  <text x="1150" y="424" class="mono">get_ticket</text>
  <text x="1360" y="336" class="xs">← 정책 검색</text>
  <text x="1360" y="358" class="xs">   (키워드 + IDF)</text>

  <rect x="1130" y="470" width="400" height="200" rx="10" fill="#fff" stroke="#86cfa3"/>
  <text x="1150" y="498" class="t">제안 도구 <tspan class="xs" font-weight="400">propose 권한 · 에이전트만</tspan></text>
  <text x="1150" y="526" class="mono">create_ticket</text>
  <text x="1150" y="548" class="mono">add_comment</text>
  <text x="1150" y="570" class="mono">update_ticket_status</text>
  <text x="1150" y="592" class="mono">link_policy_section</text>
  <text x="1150" y="614" class="mono">propose_policy_change <tspan fill="#b7791f">(승인 필요)</tspan></text>
  <text x="1150" y="636" class="mono">request_approval <tspan fill="#b7791f">(승인 필요)</tspan></text>
  <text x="1150" y="658" class="xs">승인 필요 = 사람이 승인해야 반영됨</text>

  <text x="1130" y="698" class="s">정책을 직접 수정하는 도구는 <tspan font-weight="700">없음</tspan></text>

  <!-- ============ Claude API ============ -->
  <rect x="1100" y="750" width="460" height="90" rx="16" fill="#fff5ec" stroke="#d9731a" stroke-width="2"/>
  <text x="1120" y="784" class="hdr" fill="#b35c10">Claude API (Anthropic)</text>
  <text x="1120" y="812" class="s">외부 LLM 으로 전송되므로 정책서 · 코드는 모두 가상 데이터</text>

  <!-- ============ 화살표 ============ -->
  <!-- ① 개발자 → MCP (read) -->
  <path d="M290,200 H320 V106 H1500 V150" fill="none" stroke="#2e9e5b" stroke-width="2.5" marker-end="url(#arrowG)"/>
  <rect x="560" y="93" width="400" height="26" rx="6" fill="#fff"/>
  <text x="760" y="111" class="edge" text-anchor="middle" fill="#23804a">MCP 직접 연결 · read 권한 키 (조회만)</text>

  <!-- ② 질문하는 사람 → 웹 UI -->
  <path d="M290,450 H325 V226 H388" fill="none" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- ③ 정책 담당자 → 웹 UI -->
  <path d="M290,690 H345 V250 H388" fill="none" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 내부 흐름 -->
  <line x1="690" y1="270" x2="690" y2="298" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="690" y1="390" x2="690" y2="418" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="870" y1="570" x2="870" y2="598" stroke="#444" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- REST ↔ 저장소 -->
  <path d="M390,370 H366 V700 H388" fill="none" stroke="#b8962c" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="384" y="535" class="xs" transform="rotate(-90 384 535)" text-anchor="middle" fill="#8a6d10">읽기 · 쓰기</text>

  <!-- 에이전트 → MCP (propose) -->
  <path d="M990,470 H1128" fill="none" stroke="#2e9e5b" stroke-width="2.5" marker-end="url(#arrowG)"/>
  <text x="1045" y="492" class="xs" text-anchor="middle" fill="#23804a">MCP 연결</text>
  <text x="1045" y="508" class="xs" text-anchor="middle" fill="#23804a">propose 권한 키</text>

  <!-- MCP → REST -->
  <path d="M1128,345 H992" fill="none" stroke="#2e9e5b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowG)"/>
  <text x="1060" y="335" class="xs" text-anchor="middle" fill="#23804a">도구 실행 =</text>
  <text x="1060" y="365" class="xs" text-anchor="middle" fill="#23804a">REST 호출</text>

  <!-- 에이전트 → Claude API -->
  <path d="M990,545 H1060 V795 H1098" fill="none" stroke="#d9731a" stroke-width="2.5" marker-end="url(#arrowO)"/>
  <text x="1078" y="660" class="xs" transform="rotate(-90 1078 660)" text-anchor="middle" fill="#b35c10">모델 호출 (스트리밍)</text>

  <!-- 번호 배지 -->
  <circle cx="540" cy="106" r="14" fill="#2e9e5b"/><text x="540" y="111" class="badge" text-anchor="middle">1</text>
  <circle cx="325" cy="340" r="14" fill="#3b6fd8"/><text x="325" y="345" class="badge" text-anchor="middle">2</text>
  <circle cx="345" cy="560" r="14" fill="#7a4fd0"/><text x="345" y="565" class="badge" text-anchor="middle">3</text>

  <!-- ============ 범례 ============ -->
  <rect x="40" y="880" width="1520" height="120" rx="12" fill="#fafafa" stroke="#e1e4e8"/>
  <circle cx="68" cy="912" r="12" fill="#2e9e5b"/><text x="68" y="917" class="badge" font-size="13" text-anchor="middle">1</text>
  <text x="90" y="917" class="s"><tspan font-weight="700">정책 조회:</tspan> 개발자의 AI 도구가 MCP로 정책을 검색하고 출처(문서, 섹션, 버전)와 함께 답합니다. read 권한이라 조회 도구만 보입니다.</text>
  <circle cx="68" cy="946" r="12" fill="#3b6fd8"/><text x="68" y="951" class="badge" font-size="13" text-anchor="middle">2</text>
  <text x="90" y="951" class="s"><tspan font-weight="700">질의응답, 공백 감지:</tspan> 에이전트가 같은 MCP로 검색해서 출처와 함께 답하고, 근거가 없거나 문서끼리 다르면 담당자에게 티켓을 만듭니다.</text>
  <circle cx="68" cy="980" r="12" fill="#7a4fd0"/><text x="68" y="985" class="badge" font-size="13" text-anchor="middle">3</text>
  <text x="90" y="985" class="s"><tspan font-weight="700">정책서 갱신:</tspan> 담당자가 결정을 남기면 에이전트가 변경안을 만들고, 담당자가 승인하면 새 버전이 됩니다. 수정요청하면 다시 만듭니다.</text>
</svg>
