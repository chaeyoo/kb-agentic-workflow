# Render Blueprint — 웹 서비스 2개 (DB 없음: 상태는 service 의 data/store.json, 재배포 시 시드로 초기화)
#
# 값은 여기에 적지 않는다. Render 대시보드에서 채운다 (sync: false = 키만 정의).
# 배포 후 채워야 하는 값:
#   kb-policy-service: ANTHROPIC_API_KEY, MCP_URL(= mcp 서비스 주소 + /mcp), MCP_AGENT_TOKEN, MCP_TOKENS(internals 표시용, mcp 와 같은 값)
#   kb-policy-mcp:     SERVICE_URL(= service 서비스 주소), MCP_TOKENS
# 자세한 설명은 .env.example 과 docs/06-try-it.md.
services:
  - type: web
    name: kb-policy-service
    runtime: node
    plan: free
    # NODE_ENV=production 을 설정하지 말 것: devDependencies(vite 등)가 빠져 웹 빌드가 실패한다
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @kb/web build
    startCommand: pnpm start:service
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_EFFORT
        sync: false
      - key: LLM_MODE
        sync: false
      - key: REPLAY_SPEED
        sync: false
      - key: MCP_URL
        sync: false
      - key: MCP_AGENT_TOKEN
        sync: false
      - key: MCP_TOKENS
        sync: false
      - key: TOOL_DESCRIPTIONS
        sync: false

  - type: web
    name: kb-policy-mcp
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm start:mcp
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SERVICE_URL
        sync: false
      - key: MCP_TOKENS
        sync: false
      - key: TOOL_DESCRIPTIONS
        sync: false
